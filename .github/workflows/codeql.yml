name: "CodeQL"
on:
  push:
  schedule:
    - cron: '0 3 * * 0'
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: javascript,python,cpp,go,java
    - uses: github/codeql-action/analyze@v2
